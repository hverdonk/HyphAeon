[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epistaeon"
version = "0.1.0"
description = "Epistaeon: mutational trajectory scoring between ancestral and derived protein sequences"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "torch>=2.0",
    "hyphaeon-core>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
epistaeon = "epistaeon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
